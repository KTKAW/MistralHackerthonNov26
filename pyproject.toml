[project]
name = "le-chonk"
version = "0.1.0"
description = "24-hour vulnerability response demo — see PROJECT.md and docs/build-prompt.md"
# mistralai-workflows 3.20.0 requires >=3.12,<3.15 (track C); track A/B code is 3.11-compatible.
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.165.0",
    "jsonschema>=4.26.0",
    "mistralai-workflows==3.20.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.18",
    "pytest>=9.2.0",
    "python-multipart>=0.0.6",
]

[tool.pytest.ini_options]
# Root suite only. Each fleet/<svc>/tests/ suite belongs to its service and
# needs that service's own venv (see fleet/README.md).
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
