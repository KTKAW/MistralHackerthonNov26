[project]
name = "le-chonk"
version = "0.1.0"
description = "24-hour vulnerability response: one agent per repository, a gate with no model, and a draft early warning"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows==3.20.0",
    "fastapi",
    "uvicorn",
    "jsonschema",
    "packaging",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
# Dependency cooldown: resolve nothing published in the last day or so.
# Move this date forward when you need a newer release.
exclude-newer = "2026-11-20T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests", "orchestrator/tests", "web/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
