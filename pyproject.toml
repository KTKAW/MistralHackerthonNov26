[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnerability-agent"
version = "0.1.0"
description = "24-hour vulnerability response: one advisory in, one proven verdict per repository"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulnerability_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
