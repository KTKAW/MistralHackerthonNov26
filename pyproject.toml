[project]
name = "le-chonk"
version = "0.1.0"
description = "24-hour vulnerability response demo — see PROJECT.md and docs/build-prompt.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
]

[tool.pytest.ini_options]
# Root suite only. Each fleet/<svc>/tests/ suite belongs to its service and
# needs that service's own venv (see fleet/README.md).
testpaths = ["tests"]
